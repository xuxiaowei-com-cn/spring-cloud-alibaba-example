# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/en/code-security/reference/supply-chain-security/dependabot-options-reference
# https://docs.github.com/zh/code-security/reference/supply-chain-security/dependabot-options-reference

version: 2

# spring-cloud-alibaba 的 SNAPSHOT 发布在 GitHub Packages，匿名访问返回 401，
# Dependabot 需要凭据才能解析/更新这些依赖。
# 需要在仓库 Settings → Secrets and variables → Dependabot 中配置 PACKAGES_TOKEN，
# 值为具有 read:packages 权限的 GitHub PAT。
# 注意：不要把 PACKAGES_TOKEN 设置在 Actions 中，否则无效
registries:
  alibaba-sca:
    type: maven-repository
    url: https://maven.pkg.github.com/alibaba/spring-cloud-alibaba
    username: xuxiaowei-com-cn
    password: ${{ secrets.PACKAGES_TOKEN }}

updates:
  - package-ecosystem: "maven" # See documentation for possible values
    directory: "/spring-cloud-2026.0.x" # Location of package manifests
    registries:
      - alibaba-sca
    open-pull-requests-limit: 50
    schedule:
      interval: "daily"
      time: "00:00"
      timezone: "Asia/Shanghai"

  - package-ecosystem: "maven" # See documentation for possible values
    directory: "/spring-cloud-2025.1.x" # Location of package manifests
    registries:
      - alibaba-sca
    open-pull-requests-limit: 50
    schedule:
      interval: "daily"
      time: "00:00"
      timezone: "Asia/Shanghai"

  - package-ecosystem: "maven" # See documentation for possible values
    directory: "/spring-cloud-2025.0.x" # Location of package manifests
    registries:
      - alibaba-sca
    open-pull-requests-limit: 50
    schedule:
      interval: "daily"
      time: "00:00"
      timezone: "Asia/Shanghai"
    ignore:
      - dependency-name: org.springframework.boot:spring-boot-starter-parent
        versions:
          - ">= 4"
      - dependency-name: org.springframework.cloud:spring-cloud-dependencies
        versions:
          - ">= 2025.1"
      - dependency-name: com.alibaba.cloud:spring-cloud-alibaba-dependencies
        versions:
          - ">= 2025.1"
